<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fab-Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAF1; --panel:#F7F9FC; --panel2:#FFFFFF; --ink:#0D1A2B; --ink2:#47576D; --line:#CBD3DF; --grid:rgba(13,26,43,.045);
  --fab:#4B3FD8; --fabink:#FFFFFF; --fabsoft:#E3E0FB;
  --fdy:#E8A010; --fdyink:#241800; --fdysoft:#FBEBC8;
  --good:#0E8A5F; --bad:#C8363D; --sig:#12958D;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --panel:#111C2E; --panel2:#16243A; --ink:#E7EDF7; --ink2:#9FB0C6; --line:#25354D; --grid:rgba(231,237,247,.04);
  --fab:#8F88FF; --fabink:#0B0830; --fabsoft:#262160; --fdy:#F2B134; --fdyink:#241800; --fdysoft:#3A2B08; --good:#38C690; --bad:#FF7A80; --sig:#3CC8BE;}}
:root[data-theme="dark"]{
  --bg:#0A1220; --panel:#111C2E; --panel2:#16243A; --ink:#E7EDF7; --ink2:#9FB0C6; --line:#25354D; --grid:rgba(231,237,247,.04);
  --fab:#8F88FF; --fabink:#0B0830; --fabsoft:#262160; --fdy:#F2B134; --fdyink:#241800; --fdysoft:#3A2B08; --good:#38C690; --bad:#FF7A80; --sig:#3CC8BE;}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 22px;min-height:100vh}
h1,h2,h3{margin:0;font-weight:700}
.disp{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:40px;height:40px}
.brand .word{font-size:30px;line-height:1}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.f{background:var(--fab);color:var(--fabink);border-color:transparent}
.chip.d{background:var(--fdy);color:var(--fdyink);border-color:transparent}
.chip.live{border-color:var(--sig);color:var(--sig)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.late{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.panel+.panel{margin-top:14px}
.panel h2{font-size:18px;margin-bottom:6px}
.panel h3{font-size:15px;margin-bottom:4px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.col>.panel+.panel{margin-top:14px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.roleband{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:6px 6px 0 0;margin:-16px -18px 14px}
.roleband.f{background:var(--fab);color:var(--fabink)}
.roleband.d{background:var(--fdy);color:var(--fdyink)}
.roleband .disp{font-size:26px;line-height:1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.step{padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--panel2)}
.step.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.now{border-color:var(--sig);color:var(--sig);box-shadow:0 0 0 2px color-mix(in srgb,var(--sig) 25%,transparent)}
.btn{border:0;border-radius:7px;padding:10px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.f{background:var(--fab);color:var(--fabink)}
.btn.d{background:var(--fdy);color:var(--fdyink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.fld{display:block;font-weight:600;margin:12px 0 4px}
.ctl{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;min-width:120px;accent-color:var(--ink)}
input[type=number],input[type=text],input[type=password],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink)}
input[type=number]{width:96px}
.msg{min-height:20px;font-size:13.5px;margin-top:6px}
.msg.err{color:var(--bad)}
.stmt{width:100%;border-collapse:collapse}
.stmt td,.stmt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.stmt td:last-child,.stmt th:last-child.r{text-align:right}
.stmt tr.tot td{font-weight:800;font-size:17px;border-bottom:2px solid var(--ink)}
.stmt .sub td{color:var(--ink2);font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.big{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:44px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
svg text{font-family:"Hanken Grotesk",sans-serif}
.t-free{fill:var(--line)}.t-res{fill:var(--fab)}.t-sold{fill:var(--fab)}.t-ext{fill:var(--fdy)}
.t-excess{fill:url(#hatch);stroke:var(--bad);stroke-width:1.2}
.t-unused{fill:none;stroke:var(--fab);stroke-width:1.6}
.t-inc{fill:var(--fabsoft);stroke:var(--fab);stroke-width:1.4;stroke-dasharray:3 2}
.t-req{fill:var(--fabsoft);stroke:var(--fab);stroke-width:1.6}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{font-size:12.5px;color:var(--ink2);font-weight:600}
table.data td.r,table.data th.r{text-align:right}
.scroll{overflow-x:auto}
details{margin-top:12px}summary{cursor:pointer;font-weight:700}
textarea{width:100%;min-height:74px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--good);color:#fff}.pill.wait{background:var(--fdysoft);color:var(--ink)}
.pill.f{background:var(--fab);color:var(--fabink)}.pill.d{background:var(--fdy);color:var(--fdyink)}
/* hero / join */
.hero{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:34px;align-items:center;padding:20px 0 26px}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero .wafer{max-width:260px;margin:0 auto}}
.hero h1{font-size:clamp(54px,9vw,104px);line-height:.88}
.hero p{max-width:46ch;font-size:17px}
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.bay{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px}
.bay h3{margin-bottom:8px}
.seat{display:flex;width:100%;justify-content:space-between;align-items:center;margin-top:6px;padding:8px 10px;border-radius:6px;border:1.5px solid;background:transparent;font-weight:700;text-align:left}
.seat.f{border-color:var(--fab);color:var(--fab)}.seat.d{border-color:var(--fdy);color:var(--ink)}
.seat[disabled]{opacity:.55;cursor:not-allowed}
.die{transform-box:fill-box;transform-origin:center}
.anim .die{animation:dieIn .5s both cubic-bezier(.2,.8,.2,1)}
@keyframes dieIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.anim .die{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9;max-width:90vw}
.banner{background:var(--fdysoft);border:1px solid var(--fdy);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.kv .hid{color:var(--ink2);font-style:italic}
.toggles{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px}
.toggles label{display:flex;align-items:center;gap:7px;font-weight:600}
.counter{font-size:15px}

/* ---- colour pass ---- */
:root{--fab2:#9B5CF6;--fdy2:#FF7A3D;--pink:#F0488F;--glow1:rgba(91,63,255,.20);--glow2:rgba(25,195,177,.18);--glow3:rgba(255,176,32,.22);--tpos:rgba(14,138,95,.13);--tneg:rgba(200,54,61,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fab2:#D6A0FF;--fdy2:#FF9A5C;--pink:#FF7DB4;--glow1:rgba(143,136,255,.22);--glow2:rgba(60,200,190,.14);--glow3:rgba(242,177,52,.14);--tpos:rgba(56,198,144,.16);--tneg:rgba(255,122,128,.16)}}
:root[data-theme="dark"]{--fab2:#D6A0FF;--fdy2:#FF9A5C;--pink:#FF7DB4;--glow1:rgba(143,136,255,.22);--glow2:rgba(60,200,190,.14);--glow3:rgba(242,177,52,.14);--tpos:rgba(56,198,144,.16);--tneg:rgba(255,122,128,.16)}
body{background-image:radial-gradient(900px 520px at 6% -6%,var(--glow1),transparent 62%),radial-gradient(820px 520px at 102% 0%,var(--glow3),transparent 58%),radial-gradient(900px 620px at 55% 112%,var(--glow2),transparent 62%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,auto,30px 22px,30px 22px;background-repeat:no-repeat,no-repeat,no-repeat,repeat,repeat;background-attachment:fixed,fixed,fixed,scroll,scroll}
.hero h1,.brand .word{background:linear-gradient(95deg,var(--fab) 0%,var(--pink) 52%,var(--fdy) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero .wafer{filter:drop-shadow(0 14px 34px var(--glow1))}
.roleband.f{background:linear-gradient(100deg,var(--fab),var(--fab2))}
.roleband.d{background:linear-gradient(100deg,var(--fdy),var(--fdy2))}
.btn.f,.chip.f{background:linear-gradient(100deg,var(--fab),var(--fab2))}
.btn.d,.chip.d{background:linear-gradient(100deg,var(--fdy),var(--fdy2))}
.btn:not(.ghost):not([disabled]):hover{filter:brightness(1.08)}
.panel{box-shadow:0 1px 0 var(--line),0 8px 24px -16px var(--glow1)}
.panel>h3::before,.panel>h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--fab),var(--pink),var(--fdy));margin-right:9px;vertical-align:1px}
.step.done{background:linear-gradient(90deg,var(--sig),var(--fab));border-color:transparent;color:#fff}
.step.now{background:var(--panel2);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--sig) 25%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--sig) 10%,transparent)}}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.kpi{flex:1;min-width:140px;padding:12px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.kpi.pos{background:var(--tpos);border-color:transparent}.kpi.neg{background:var(--tneg);border-color:transparent}
.kpi .big{display:block}
.seat.f:not([disabled]):hover{background:linear-gradient(100deg,var(--fab),var(--fab2));color:var(--fabink)}
.seat.d:not([disabled]):hover{background:linear-gradient(100deg,var(--fdy),var(--fdy2));color:var(--fdyink)}
.bay{border-top:4px solid;border-image:linear-gradient(90deg,var(--fab),var(--pink),var(--fdy)) 1}
.t-sold,.t-res{fill:url(#gF)}.t-ext{fill:url(#gD)}
.rv{animation:tileIn .45s both cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
@keyframes tileIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.rv,.step.now{animation:none}}
.pill.flag{background:var(--tneg);color:var(--bad)}
.ver-strip{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ver-strip span{padding:3px 12px;border-radius:99px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.ver-strip span.on{background:linear-gradient(100deg,var(--fab),var(--pink));color:#fff;border-color:transparent}
.ver-strip span.past{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.wf-lab{font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.wf-tick{font-size:14px;fill:var(--ink2)}
.wf-hint{font-size:12.5px;color:var(--ink2);margin:0 0 4px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cardhead h3{margin:0}

.ov{position:fixed;inset:0;background:rgba(8,14,26,.55);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h3{font-size:20px;margin-bottom:8px}
.dlg .row{margin-top:16px;justify-content:flex-end}
.dlg label{display:block;font-weight:600;margin-top:10px}

button.brand{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.title{min-height:calc(100vh - 60px);display:grid;place-items:center;text-align:center;padding:24px 0}
.title .inner{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:760px}
.title .wafer{width:min(250px,32vh,60vw);filter:drop-shadow(0 22px 50px var(--glow1))}
.title h1{font-size:clamp(52px,min(12.5vw,15vh),150px);white-space:nowrap;line-height:.9;margin:8px 0 0;background:linear-gradient(95deg,var(--fab) 0%,var(--pink) 50%,var(--fdy) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:titleIn .9s .75s both cubic-bezier(.2,.8,.2,1)}
.title .tag{font-size:clamp(17px,2.4vw,22px);max-width:34ch;margin:6px 0 0;animation:titleIn .9s 1s both}
.title .facts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px;animation:titleIn .9s 1.15s both}
.title .facts span{padding:5px 14px;border-radius:99px;font-weight:700;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.title .facts .f{background:linear-gradient(100deg,var(--fab),var(--fab2));color:var(--fabink);border-color:transparent}
.title .facts .d{background:linear-gradient(100deg,var(--fdy),var(--fdy2));color:var(--fdyink);border-color:transparent}
.title .go{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px;animation:titleIn .9s 1.3s both}
.btn.xl{padding:15px 34px;font-size:19px;border-radius:10px}
.btn.xl.main{background:linear-gradient(100deg,var(--fab),var(--pink) 60%,var(--fdy2));color:#fff}
@keyframes titleIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.title h1,.title .tag,.title .facts,.title .go{animation:none}}

/* ---- explanations, guide, seed ---- */
.why{margin:10px 0 4px;padding:9px 12px;border-left:4px solid var(--sig);background:color-mix(in srgb,var(--sig) 9%,transparent);border-radius:0 6px 6px 0;font-size:13.5px}
.why b{display:block;margin-bottom:2px}
.ex{margin-top:14px}
.ex h3{font-size:16px;margin-bottom:6px}
.exi{padding:8px 0 8px 12px;border-left:3px solid var(--line);margin:6px 0}
.exi>b{display:block;font-size:13.5px}
.exi p{margin:2px 0 0;font-size:14px;max-width:72ch}
.exi.good{border-color:var(--good)}.exi.bad{border-color:var(--bad)}.exi.sig{border-color:var(--sig)}.exi.fab{border-color:var(--fab)}.exi.fdy{border-color:var(--fdy)}
.guide p{margin:6px 0;max-width:70ch}
.guide ol{margin:6px 0 6px 20px;padding:0}
.guide ol li{margin:2px 0}
.gtable{width:100%;border-collapse:collapse;font-size:13.5px}
.gtable th,.gtable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.gtable th{font-size:12.5px;color:var(--ink2);font-weight:600}
.dlg.wide{max-width:900px;max-height:88vh;overflow:auto}
.seedbox{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px dashed var(--ink2);border-radius:8px;font-size:13.5px}
.seedbox code{font-size:15px;font-weight:700;letter-spacing:.04em}
.newv{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sig);color:#fff;margin-left:6px;vertical-align:2px}
.botbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;border-radius:6px;background:var(--fabsoft);font-size:13.5px}
.chipbtn{cursor:pointer;color:var(--ink)}
table.hist th,table.hist td{padding:6px 5px;font-size:13px}
.chipbtn:hover{border-color:var(--ink2)}
.qs{margin:6px 0 0 20px;padding:0}.qs li{margin:3px 0}

/* class code box */
.classbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin:0 0 14px;border-radius:8px;background:var(--fabsoft);border:1px solid var(--line)}
.classbox .code{font-size:30px;font-weight:800;letter-spacing:.16em;line-height:1.1}
/* negotiation thread */
.thread{list-style:none;margin:12px 0;padding:0}
.thread li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 12px;margin:5px 0;border-radius:6px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--fab)}
.thread li.td{border-left-color:var(--fdy)}
.thread li .num{margin-left:auto;font-weight:700}
.cform{margin-top:16px;padding:12px 14px;border:1px dashed var(--ink2);border-radius:8px}
.cform h3{font-size:15px;margin:0 0 2px}
/* version switcher, original style */
.vswitch{margin:10px 0 12px}
.vs-lab{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.vs-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:760px){.vs-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vs{display:flex;align-items:center;gap:9px;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit}
.vs:hover{border-color:var(--ink2)}
.vs-i{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line);color:var(--ink)}
.vs-t{flex:1;min-width:0;line-height:1.25}.vs-t b{display:block;font-size:13.5px}.vs-t small{color:var(--ink2);font-size:12px}
.vs-c{font-size:12px;font-weight:700;color:var(--ink2)}
.vs.on{border-color:transparent;background:linear-gradient(100deg,var(--fab),var(--pink));color:#fff}
.vs.on .vs-t small,.vs.on .vs-c{color:rgba(255,255,255,.85)}.vs.on .vs-i{background:rgba(255,255,255,.25);color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

function buildPlan(n,extra){const p=[{ver:'private',r:0,practice:true}];for(const v of VORDER)for(let r=1;r<=n;r++)p.push({ver:v,r});
  const list=Array.isArray(extra)?extra:[];const cnt={};for(const v of list){if(!VERS[v])continue;cnt[v]=(cnt[v]||0)+1;p.push({ver:v,r:n+cnt[v],extra:true});}return p;}
const lo=S=>S<0?0:120;
function mS(K,S){const l=lo(S),u=l+160;if(K<=l)return K;if(K>=u)return l+80;return K-(K-l)**2/320;}
function eS(L,S){const l=lo(S),u=l+160;if(L<=l)return 0;if(L>=u)return L-(l+80);return (L-l)**2/320;}
function econ(K,F,L,D){
  const sold=Math.min(D,K),purchased=L>0?Math.max(L,sold):sold;
  return {sold,purchased,unmet:D-sold,excess:purchased-sold,unused:K-purchased,
    fProfit:P*sold-W*purchased-F,dProfit:(W-COST)*purchased+B*(C-K)+F};
}
function expProfit(role,K,F,L,S){
  const f=s=>{const m=mS(K,s),e=L>0?eS(L,s):0;
    return role==='f'?P*m-W*(m+e)-F:(W-COST)*(m+e)+B*(C-K)+F;};
  return S===null||S===undefined?(f(-60)+f(60))/2:f(S);
}
// Negotiation: offers alternate fabless -> foundry -> fabless. The final decision is stored in mv.resp.
function offersOf(mv){const o=[];if(mv&&mv.prop&&!mv.prop.skip){o.push(Object.assign({},mv.prop,{by:'f'}));if(mv.o2){o.push(Object.assign({},mv.o2,{by:'d'}));if(mv.o3)o.push(Object.assign({},mv.o3,{by:'f'}));}}return o;}
function negTurn(mv){const o=offersOf(mv);if(!o.length||mv.resp)return null;return o[o.length-1].by==='f'?'d':'f';}
function outcome(ver,mv,D){
  const ext=VERS[ver].ext,miss=[];
  let R=0,K0=0;
  if(mv.req)R=mv.req.R;else miss.push('request');
  if(mv.alloc)K0=Math.min(mv.alloc.K0,R);else miss.push('allocation');
  let K=K0,F=0,L=0,acc=false,proposed=false,K1=null,X=null,nOff=0,accOn=null,accBy=null,finBy=null,endBy=null;
  if(ext&&mv.prop&&!mv.prop.skip){
    proposed=true;const offs=offersOf(mv);nOff=offs.length;let fin=offs[nOff-1];
    if(mv.resp){const ix=Math.min(nOff,Math.max(1,Number(mv.resp.on)||nOff));fin=offs[ix-1];endBy=mv.resp.by||(fin.by==='f'?'d':'f');
      if(mv.resp.accept){acc=true;accOn=ix;accBy=endBy;}}
    else miss.push('response');
    K1=fin.K1;X=fin.X;finBy=fin.by;
    if(acc){K=K1;if(ext==='fee')F=X;else L=X;}
  }
  const o=econ(K,F,L,D),b=econ(K0,0,0,D);
  return Object.assign(o,{R,K0,K,F,L,acc,proposed,K1,X,D,miss,base:b,nOff,accOn,accBy,finBy,endBy});
}
// Seeded randomness: the same seed (and settings) always yields the same signals and demand.
function hashStr(str){let h1=0xdeadbeef^str.length,h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h1^h2)>>>0;}
function rngFrom(key){let a=hashStr(String(key));return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function newSeed(){return String(100000+Math.floor(Math.random()*900000));}
function scenKey(step,seed,repeat){return seed+'|'+(step.practice?'practice':(repeat?'round-'+step.r:step.ver+'-'+step.r));}
function genScen(plan,seed,repeat){return plan.map(s=>{const r=rngFrom(scenKey(s,seed,repeat));return {S:r()<.5?-60:60,eps:Math.floor(r()*161)-80};});}
function checkReq(R){return Number.isInteger(R)&&R>=0&&R<=C?'':'Enter a whole number from 0 to '+C+'.';}
function checkAlloc(K0,R){return Number.isInteger(K0)&&K0>=0&&K0<=R?'':'Allocation must be a whole number from 0 to the request ('+R+').';}
function checkProp(K0,K1,X,ext){
  if(!Number.isInteger(K1)||K1<=K0||K1>C)return 'New guarantee must be above '+K0+' and at most '+C+'.';
  if(!Number.isInteger(X)||X<0)return ext==='fee'?'Fee must be a whole number, 0 or more.':'Minimum purchase must be a whole number, 0 or more.';
  if(ext==='min'&&X>K1)return 'Minimum purchase cannot exceed the new guarantee ('+K1+').';
  return '';
}

/* ---------- storage layer: claude.ai db, Firebase, or this browser ---------- */
const Store={mode:'local',db:null,loc:new Map(),subs:[],online:false};
let NS=null;            // class code: all data for a class lives under sessions/<code>/
let standalone=false;   // true outside claude.ai
Store.p=function(path){return NS?'sessions/'+NS+'/'+path:path;};
function deepMerge(a,b){const o=Object.assign({},a);for(const k in b){const v=b[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v;}return o;}
function locSnap(path){
  if(path.split('/').length%2===0){return Store.loc.has(path)?Object.assign({},Store.loc.get(path)):null;}
  const out=[];for(const [k,v] of Store.loc){if(k.startsWith(path+'/')&&k.split('/').length===path.split('/').length+1)out.push(Object.assign({_id:k.split('/').pop()},v));}return out;}
const clean=d=>JSON.parse(JSON.stringify(d));
Store.sub=function(path,cb){
  path=this.p(path);
  if(this.mode==='live'){
    if(path.split('/').length%2===0)return this.db.doc(path).onSnapshot(s=>cb(s.exists?Object.assign({},s.data()):null),e=>console.warn(e));
    return this.db.collection(path).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({_id:d.id},d.data()))),e=>console.warn(e));
  }
  const rec={path,cb};this.subs.push(rec);setTimeout(()=>cb(locSnap(path)),0);
  return ()=>{this.subs=this.subs.filter(x=>x!==rec);};
};
Store.get=async function(path,raw){const pth=raw?path:this.p(path);
  if(this.mode==='live'){const s=await this.db.doc(pth).get();return s.exists?Object.assign({},s.data()):null;}
  return this.loc.has(pth)?Object.assign({},this.loc.get(pth)):null;};
// browser-only mode keeps one localStorage key per document, so several tabs can play together
Store.writeLocal=function(pth,v){if(v==null)this.loc.delete(pth);else this.loc.set(pth,v);
  try{if(v==null)localStorage.removeItem('frdoc:'+pth);else localStorage.setItem('frdoc:'+pth,JSON.stringify(v));}catch(e){}
  this.notify();};
Store.restore=function(){this.loc=new Map();try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('frdoc:'))this.loc.set(k.slice(6),JSON.parse(localStorage.getItem(k)));}}catch(e){}};
Store.onStorage=function(e){if(!e.key||!e.key.startsWith('frdoc:'))return;const pth=e.key.slice(6);
  try{if(e.newValue==null)Store.loc.delete(pth);else Store.loc.set(pth,JSON.parse(e.newValue));}catch(err){return;}
  for(const s of Store.subs)s.cb(locSnap(s.path));};
Store.notify=function(){for(const s of this.subs)s.cb(locSnap(s.path));};
Store.set=async function(path,data){const pth=this.p(path);
  if(this.mode==='live'){await this.db.doc(pth).set(clean(data));return;}
  this.writeLocal(pth,clean(data));};
Store.update=async function(path,data){const pth=this.p(path);
  if(this.mode==='live'){await this.db.doc(pth).update(clean(data));return;}
  this.writeLocal(pth,deepMerge(this.loc.get(pth)||{},clean(data)));};
Store.del=async function(path){const pth=this.p(path);if(this.mode==='local'){this.writeLocal(pth,null);return;}const r=this.db.doc(pth);if(typeof r.delete==='function')await r.delete();};
async function save(op,path,data){
  try{await Store[op](path,data);return true;}
  catch(e){console.warn(e);toast(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'Not saved: you don’t have permission for that.':'Not saved. Check your connection and try again.');return false;}
}

function reindex(){
  MV={};RV={};
  if(!G)return;
  const att=G.att||{};
  for(const m of movesRaw){if(m.sid!==G.sid)continue;if((m.att||0)!==(att[m.pos]||0))continue;((MV[m.pos]=MV[m.pos]||{})[m.pair]=MV[m.pos][m.pair]||{})[m.kind]=m;}
  for(const r of revRaw){if(r.sid===G.sid)RV[r.pos]=r;}
  plan=buildPlan(G.n,G.extra);
}
function rq(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();autoCheck();botCheck();});}
const pairById=id=>pairs.find(p=>p.id===id);
const inSeat=(s,u)=>!!s&&(s.uid===u||(Array.isArray(s.members)&&s.members.includes(u)));
function seatOf(u){if(!isInst&&u===uid){if(!mySeat)return null;const p=pairById(mySeat.pid);return p&&p[mySeat.role]?{pair:p,role:mySeat.role}:null;}for(const p of pairs){if(inSeat(p.f,u))return {pair:p,role:'f'};if(inSeat(p.d,u))return {pair:p,role:'d'};}return null;}
const curStep=()=>G&&G.pos>=0?plan[G.pos]:null;
const stepLabel=s=>s?(s.practice?'Practice round':'Round '+s.r+' of '+plan.filter(x=>x.ver===s.ver&&!x.practice).length):'';
function scenAt(pos){const s=plan[pos];if(!s||!scen||scen.sid!==(G&&G.sid))return null;
  if(scen.seed!=null){const r=rngFrom(scenKey(s,scen.seed,scen.repeat));return {S:r()<.5?-60:60,eps:Math.floor(r()*161)-80};}
  return (scen.items&&scen.items[pos])||null;}
function mvOf(pos,pairId){return (MV[pos]&&MV[pos][pairId])||{};}
function resultFor(pos,pairId){const r=RV[pos];if(!r)return null;return outcome(plan[pos].ver,mvOf(pos,pairId),r.D);}
function cumFor(pairId,verFilter){
  let f=0,d=0,n=0;
  for(let pos=1;pos<plan.length;pos++){if(!RV[pos])continue;if(verFilter&&verFilter!=='all'&&plan[pos].ver!==verFilter)continue;
    const o=resultFor(pos,pairId);f+=o.fProfit;d+=o.dProfit;n++;}
  return {f,d,t:f+d,n};
}
function activePairs(){return pairs.filter(p=>p.f&&p.d);}
// Results and history show only the current game: the version being played (or the practice round).
function sameGame(pos){const a=curStep(),b=plan[pos];if(!a||!b)return false;return !!a.practice===!!b.practice&&a.ver===b.ver;}
function gameTotal(pairId){let f=0,d=0,n=0;for(let pos=0;pos<plan.length;pos++){if(!RV[pos]||!sameGame(pos))continue;const o=resultFor(pos,pairId);f+=o.fProfit;d+=o.dProfit;n++;}return {f,d,t:f+d,n};}
function gameName(){const a=curStep();return a?(a.practice?'Practice round':GUIDE[a.ver].title):'';}
function stageKind(stage){return {request:'req',allocate:'alloc',propose:'prop',respond:'resp'}[stage];}
function stageStatus(){
  const stage=G.stage,kind=stageKind(stage);if(!kind)return {done:0,total:0,pending:[]};
  let done=0,total=0;const pending=[];
  for(const p of activePairs()){
    const mv=mvOf(G.pos,p.id);
    if(kind==='prop'&&mv.alloc&&mv.alloc.K0>=C){continue;}
    if(kind==='resp'&&!(mv.prop&&!mv.prop.skip))continue;
    total++;if(mv[kind])done++;else pending.push(p.n);
  }
  return {done,total,pending};
}

  const want=isInst?pairs.map(p=>p.id):(mySeat&&mySeat.pid?[mySeat.pid]:[]);
  for(const pid of Object.keys(chainSubs))if(!want.includes(pid)){try{chainSubs[pid]();}catch(e){}delete chainSubs[pid];delete movesBy[pid];}

function botMove(st,ver,ext,S,mv,rnd){
  const j=n=>Math.round((rnd()*2-1)*n),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lo=S<0?0:120;
  if(st==='request')return {R:clamp((S<0?150:260)+j(15),0,C)};

function botNeg(ext,S,mv,who,rnd){
  const offs=offersOf(mv),n=offs.length,last=offs[n-1],K0=mv.alloc?mv.alloc.K0:0,canC=n<NEGMAX();
  const gain=(role,K1,X)=>expProfit(role,K1,ext==='fee'?X:0,ext==='min'?X:0,S)-expProfit(role,K0,0,0,S);
  const g=gain(who,last.K1,last.X),dec=a=>({kind:'resp',data:{accept:a,by:who,on:n}});

    return {kind:n===1?'o2':'o3',data:{K1:last.K1,X,by:'d'}};

function botCheck(){
  if(!isInst||!G||G.bots===false||!['request','allocate','propose','respond'].includes(G.stage))return;
  const step=curStep();if(!step)return;

  for(const p of activePairs()){
    const mv=mvOf(G.pos,p.id);let actor,kind;
    if(st==='respond'){if(!ext)continue;actor=negTurn(mv);if(!actor)continue;kind='neg';}
    else{actor={request:'f',allocate:'d',propose:'f'}[st];kind=stageKind(st);if(mv[kind])continue;if(st==='propose'&&(!ext||(mv.alloc&&mv.alloc.K0>=C)))continue;}
    const seat=p[actor];if(!seat||!seat.bot)continue;
    const key=G.sid+'_'+G.pos+'_'+st+'_'+p.id+'#'+attNow()+'#'+offersOf(mv).length;if(botFired.has(key))continue;botFired.add(key);

}

const WAF=(function(){
  const w=1,h=.86;
  function build(r){const out=[],n=Math.ceil(r/h)+2;
    for(let j=-n;j<n;j++)for(let i=-n;i<n;i++){const x=i*w,y=j*h;
      const far=Math.max(Math.hypot(x,y),Math.hypot(x+w,y),Math.hypot(x,y+h),Math.hypot(x+w,y+h));
      if(far<=r)out.push({x:x,y:y,j:j,far:far});}
    return out;}
  let d=[],r=6;
  for(;r<20;r+=0.02){d=build(r);if(d.length>=C)break;}
  d.sort((a,b)=>b.far-a.far);d=d.slice(d.length-C);
  d.sort((a,b)=>b.j-a.j||a.x-b.x);
  return {dies:d,r:r};
})();

function why(st,ext,pub,role){
  const t={
    request:'Your request is a ceiling: the foundry can protect any amount up to R, never more. Asking costs nothing by itself, because you pay only for wafers you actually buy.'+(pub?' The foundry also sees the signal, so it can check your request against the forecast.':' The foundry can’t see the signal, so it may treat your request as a hint about demand, and discount it if it looks inflated.'),
    allocate:'Each wafer start you protect earns your manufacturing margin only if the fabless’s demand reaches it. Each one you leave for external customers earns a sure external contribution. After demand is revealed, unused protected capacity can’t be resold.'+(pub?'':' You don’t see the signal, so the request is your only clue.'),
    propose:ext==='fee'?'The fee is paid whether or not demand uses the extra capacity. To be accepted it has to cover what the foundry gives up on the extra wafers, and to be worth it for you it has to stay below what the extra capacity is worth to you.'
      :'A minimum purchase means you pay for at least L wafers even if demand comes in lower, and wafers bought above demand can’t be sold. In exchange, the foundry knows more of the extra capacity will be paid for.',
    respond:ext==='fee'?'Accepting moves the extra wafer starts from external customers to the fabless. You collect the fee no matter what demand turns out to be, plus your margin on any extra wafers the fabless actually buys.'
      :'Accepting moves the extra wafer starts from external customers to the fabless. In return the fabless pays for at least L wafers even if its demand is lower, plus any extra wafers its demand actually uses.'
  }[st];
  if(st==='respond'){
    const base=role==='f'?(ext==='fee'?'The foundry is asking for different terms. Accepting means paying fee F whatever demand turns out to be, in exchange for the larger guarantee.':'The foundry is asking for different terms. Accepting means buying at least L wafers even if demand is lower, in exchange for the larger guarantee.'):t;
    return '<div class="why"><b>Why it matters</b>'+base+' A counter-offer can improve the terms, but each one uses up an offer, the final offer can only be accepted or rejected, and if nobody agrees the original plan stands.</div>';
  }
  return t?'<div class="why"><b>Why it matters</b>'+t+'</div>':'';
}
function explainHTML(role,pairId,pos){
  const step=plan[pos],ver=step.ver,ext=VERS[ver].ext,pub=VERS[ver].pub,o=resultFor(pos,pairId),r=RV[pos];
  if(!o||!r)return '';
  const f=role==='f',it=(c,t,p)=>'<div class="exi '+c+'"><b>'+t+'</b><p>'+p+'</p></div>';
  const mine=f?o.fProfit:o.dProfit,base=f?o.base.fProfit:o.base.dProfit;
  let h='';
  // demand
  h+=it('sig','Where demand came from','The signal was '+(r.S<0?'low (−60)':'high (+60)')+', so demand was always going to land between '+(r.S<0?'0 and 160':'120 and 280')+'. The remaining randomness ε = '+sgn(r.eps)+' put actual demand at <b>D = '+r.D+'</b> wafers.'+(!f&&!pub?' Your team did not see the signal this round; your only clue was the request of '+o.R+'.':''));
  // guarantee
  let g='The fabless requested '+o.R+' and the foundry protected <b>K0 = '+o.K0+'</b>.';
  if(o.miss.length)g+=' A decision was missing ('+o.miss.join(', ')+'), so the default rule applied.';
  if(ext){
    if(!o.proposed)g+=' No proposal was made, so the guarantee stayed at '+o.K0+'.';
    else if(o.acc)g+=' After '+o.nOff+' offer'+(o.nOff>1?'s':'')+', the '+(o.accBy==='d'?'foundry':'fabless')+' accepted '+(o.finBy==='f'?'the fabless’s':'the foundry’s')+' offer '+o.accOn+', raising the guarantee to <b>K = '+o.K+'</b> '+(ext==='fee'?'for a reservation fee of '+fmt(o.F)+'.':'with a minimum purchase of '+fmt(o.L)+' wafers.');
    else g+=' The negotiation ended without agreement after '+o.nOff+' offer'+(o.nOff>1?'s':'')+' (last offer: K1 = '+o.K1+', '+(ext==='fee'?'fee ':'minimum ')+fmt(o.X)+'), so the guarantee stayed at '+o.K0+'.';
  }
  g+=' That left '+(C-o.K)+' wafer starts for external customers.';
  h+=it(f?'fab':'fdy','How the guarantee was set',g);
  // demand versus capacity
  let m,mc;
  if(r.D>o.K){
    m='Demand ('+r.D+') was higher than the guarantee ('+o.K+'), so every protected wafer was used and <b>'+fmt(o.unmet)+' wafers of demand went unserved</b>.';
    m+=f?' Each unserved wafer would have earned you 240 − 80 = 160, so the shortfall cost you <b>'+fmt(160*o.unmet)+'</b> in missed profit.'
        :' Each of those wafers would have earned you 80 − 40 = 40 while costing 20 of external contribution, a net of +20 each. In this outcome a larger guarantee would have added up to <b>'+fmt(20*o.unmet)+'</b>.';
    mc=f?'bad':'';
  }else{
    m='Demand ('+r.D+') fit within the guarantee ('+o.K+'), so no demand went unserved.';
    if(o.unused>0)m+=' <b>'+fmt(o.unused)+' protected wafer starts went unused.</b>'+(f?(ext==='fee'&&o.F>0?' You pay no wholesale price on unused capacity, but part of the fee bought capacity you didn’t need this time.':' You pay nothing for unused capacity, so it cost you nothing directly.')
        :' Each one could have earned 20 from external customers, so protecting them cost you <b>'+fmt(20*o.unused)+'</b>.');
    else m+=' Every protected wafer was used.';
    mc=o.unused>0&&!f?'bad':'good';
  }
  h+=it(mc,'Demand versus the guarantee',m);
  // contract
  if(ext&&o.proposed){
    const extra=o.sold-o.base.sold,dK=(o.K1||0)-o.K0;let c='';
    if(!o.acc)c=f?'No agreement was reached, so you paid nothing extra and kept K0 = '+o.K0+'. Your profit is the same as under the original plan.':'No agreement was reached, so the original plan stood and your profit is the same as under it.';
    else{
      const xp=o.purchased-o.base.purchased;
      if(f)c=extra>0?'The extra '+dK+' wafer starts let you sell <b>'+fmt(extra)+'</b> more wafers in this outcome, worth '+fmt(160*extra)+' at 160 each.'
        :'The extra '+dK+' wafer starts were not needed this time: demand ('+r.D+') did not exceed the original guarantee of '+o.K0+', so you sold no additional wafers.';
      else c='The extra '+dK+' wafer starts cost you '+fmt(20*dK)+' of external contribution. '+(xp>0?'In return the fabless bought '+fmt(xp)+' more wafers from you, worth '+fmt(40*xp)+' at 40 each.':'The fabless bought no additional wafers this time.');
      if(ext==='fee')c+=f?' You paid the fee of '+fmt(o.F)+' regardless.':' You also collected the fee of '+fmt(o.F)+'.';
      else{
        if(o.excess>0)c+=f?' Demand ('+r.D+') came in below your commitment ('+o.L+'), so you bought <b>'+fmt(o.excess)+' wafers above demand</b> at 80 each ('+fmt(80*o.excess)+') that could not be sold.'
                        :' Demand ('+r.D+') came in below the commitment ('+o.L+'), so the fabless still paid for '+o.L+' wafers, '+fmt(o.excess)+' more than it could sell. That is the protection the commitment gives you.';
        else c+=' Demand ('+r.D+') was at or above the commitment ('+o.L+'), so the minimum purchase did not bind and cost nothing extra this time.';
      }
      c+=' <b>Net effect versus the original plan: '+sgn(mine-base)+'.</b>';
      if(ext==='fee')c+=' The fee itself only moves money between the two companies. It does not change how many wafers are made or sold.';
      else if(o.excess>0)c+=' Wafers bought above demand were produced but never sold, so they lowered the combined profit of the supply chain.';
    }
    h+=it(o.acc?(mine>=base?'good':'bad'):'',ext==='fee'?'What the reservation fee did':'What the minimum purchase did',c);
  }
  // luck versus decision
  const e=expProfit(role,o.K,o.F,o.L,r.S),d=mine-e;
  h+=it('','Decision versus luck','Given the signal'+(!f&&!pub?' (which your team did not see at the time)':'')+', the expected profit of the final agreement was <b>'+fmt(e)+'</b>. You earned <b>'+fmt(mine)+'</b>, so the random part of demand '+(d>=0?'added ':'cost you ')+fmt(Math.abs(d))+'. A sound decision can still meet bad luck, so compare choices by their expected profit, not by one round.');
  // what-if with the same demand
  const alt=dk=>{const K2=Math.max(0,Math.min(C,o.K+dk));if(K2===o.K)return null;const L2=Math.min(o.L,K2),x=econ(K2,o.F,L2,r.D);return {K:K2,v:f?x.fProfit:x.dProfit};};
  const a1=alt(20),a2=alt(-20);const parts=[];
  if(a2)parts.push('K = '+a2.K+' would have given you '+fmt(a2.v));
  if(a1)parts.push('K = '+a1.K+' would have given you '+fmt(a1.v));
  if(parts.length)h+=it('','Same demand, different guarantee','Holding demand at '+r.D+' and other terms fixed, '+parts.join(', and ')+'. In hindsight the ideal guarantee is always exactly the demand, but it has to be chosen before demand is known.');
  // optional benchmark insight
  if(G.insights){
    const kI=pub?(r.S<0?80:200):140,kE=r.S<0?144:264,pv=k=>{const x=econ(k,0,0,r.D);return f?x.fProfit:x.dProfit;};
    h+=it('sig','Benchmark comparison (released by your instructor)','A foundry maximizing its own expected profit protects K = '+kI+' here ('+(pub?'the median of demand given the signal':'the median of demand before the signal is known')+'). The guarantee that maximizes combined supply-chain profit is K = '+kE+' (the 90th percentile given the signal). With this same demand, your company would have earned '+fmt(pv(kI))+' at K = '+kI+' and '+fmt(pv(kE))+' at K = '+kE+', before any fee or commitment. Expected values given the signal: '+fmt(expProfit(role,kI,0,0,r.S))+' and '+fmt(expProfit(role,kE,0,0,r.S))+'.');
  }
  return h;
}
function versionSummary(role,pairId,ver){
  const c=cumFor(pairId,ver),mine=role==='f'?c.f:c.d,idx=role==='f'?0:1;
  let s='<p>Across the rounds of the '+esc(GUIDE[ver].title.toLowerCase())+', your company earned <b class="num">'+fmt(mine)+'</b> over '+c.n+' round'+(c.n===1?'':'s')+(c.n?' (an average of <b class="num">'+fmt(mine/c.n)+'</b> per round)':'')+'.</p>';
  s+='<div class="why"><b>Key idea</b>'+GUIDE[ver].lesson+'</div>';
  if(G.insights){const b=BENCH[ver];s+='<p class="small">Benchmark expected profit per round for your company: '+(b.ind?'independent allocation <b class="num">'+fmt(b.ind[idx])+'</b>':'')+(b.eff?', efficient allocation before any payment <b class="num">'+fmt(b.eff[idx])+'</b>':'')+'.</p>';}
  return s;
}

function steps(){
  const step=curStep(),ext=step&&VERS[step.ver].ext;
  const names=ext?['Signal','Request','Allocation','Proposal','Negotiation','Demand','Results']:['Signal','Request','Allocation','Demand','Results'];
  const map=ext?{ready:0,request:1,allocate:2,propose:3,respond:4,locked:5,settled:6}:{ready:0,request:1,allocate:2,locked:3,settled:4};
  const cur=map[G.stage];
  return '<div class="steps" aria-label="Round progress">'+names.map((n,i)=>'<span class="step'+(i<cur||G.stage==='settled'?' done':i===cur?' now':'')+'">'+n+'</span>').join('')+'</div>';
}
function setDraftDefaults(role,pairId){
  const mv=mvOf(G.pos,pairId),nOff=offersOf(mv).length;
  const key=G.sid+'_'+G.pos+'_'+G.stage+'_'+role+'_'+pairId+'_'+nOff+'#'+attNow();
  if(key===draftKey)return;draftKey=key;draft={};
  if(G.stage==='request')draft.R=140;
  if(G.stage==='allocate'){const R=mv.req?mv.req.R:0;draft.K0=Math.round(R/2);}
  if(G.stage==='propose'){const K0=mv.alloc?mv.alloc.K0:0;draft.K1=Math.min(C,K0+20);draft.X=0;}
  if(G.stage==='respond'&&nOff){const l=offersOf(mv)[nOff-1];draft.K1=l.K1;draft.X=l.X;}
}

}

        slider('K1',K0+1,C,draft.K1,'Larger guarantee K1')+
        (ext==='fee'?'<label class="fld" for="n-X">Reservation fee F (paid on top of wafers you buy)</label><div class="ctl"><input type="number" data-d="X" id="n-X" min="0" value="'+draft.X+'"></div>'
                    :slider('X',0,draft.K1,Math.min(draft.X,draft.K1),'Minimum purchase L (wafers you commit to buy)'))+
        '<p class="small" id="stmt"></p><div class="msg" id="msg"></div><div class="row"><button class="btn f" id="go" data-act="sub-prop">Send proposal</button><button class="btn ghost" data-act="sub-skip">Keep original plan</button></div>';
    }else body='<h2>Waiting for the fabless proposal</h2>'+(mv.prop?(mv.prop.skip?'<p>The fabless kept the original plan.</p>':'<p>'+stmtText(ext,K0,mv.prop.K1,mv.prop.X)+'</p>'):'<p class="muted">Your current allocation is '+K0+'.</p>');
  }else if(st==='respond'){
    const K0=mv.alloc?mv.alloc.K0:0,offs=offersOf(mv),n=offs.length,turn=negTurn(mv),mx=NEGMAX();
    const party=r=>r==='f'?'fabless':'foundry';
    if(!n)body=role==='d'?'<h2>Nothing to decide</h2><p>The fabless made no proposal. The original allocation of '+K0+' stands.</p>':'<h2>No proposal this round</h2><p>Your guarantee stays at '+K0+'.</p>';
    else if(mv.resp){const o=outcome(ver,mv,0);
      body='<h2>'+(o.acc?'Agreement reached':'No agreement')+'</h2><p>'+(o.acc?'The '+party(o.accBy)+(o.accBy===role?' (you)':'')+' accepted offer '+o.accOn+'. The guarantee rises from '+K0+' to <b class="num">'+o.K1+'</b>.':'The '+party(o.endBy)+(o.endBy===role?' (you)':'')+' rejected offer '+n+'. The original plan stands: guarantee '+K0+'.')+'</p>'+negThread(ext,offs,mv.resp,role);}
    else if(turn===role){

        '<p class="small muted">Offer '+n+' of '+mx+'. '+(canC?'You can accept, reject, or make a counter-offer.':'This is the final offer, so you can only accept or reject it.')+'</p>'+
        negThread(ext,offs,null,role)+
        '<table class="stmt"><tr><th></th><th class="r">Original plan</th><th class="r">Offer '+n+'</th></tr>'+
        '<tr><td>Fabless guarantee</td><td class="num r">'+K0+'</td><td class="num r">'+last.K1+'</td></tr>'+
        '<tr><td>External capacity</td><td class="num r">'+(C-K0)+'</td><td class="num r">'+(C-last.K1)+'</td></tr>'+
        '<tr><td>'+(ext==='fee'?'Reservation fee':'Minimum purchase')+'</td><td class="num r">0</td><td class="num r">'+fmt(last.X)+'</td></tr></table>'+
        sBadge()+why('respond',ext,true,role)+
        '<div class="row" style="margin-top:12px"><button class="btn '+role+'" data-act="sub-resp" data-v="1">Accept offer '+n+'</button><button class="btn ghost" data-act="sub-resp" data-v="0">Reject</button></div>'+
        (canC?'<div class="cform"><h3>Or make counter-offer '+(n+1)+' of '+mx+'</h3>'+(n+1===mx?'<p class="small muted">The '+party(role==='f'?'d':'f')+' will only be able to accept or reject it.</p>':'')+
          slider('K1',K0+1,C,draft.K1,'Guarantee K1')+
          (ext==='fee'?'<label class="fld" for="n-X">Reservation fee F</label><div class="ctl"><input type="number" data-d="X" id="n-X" min="0" value="'+draft.X+'"></div>'
                      :slider('X',0,draft.K1,Math.min(draft.X,draft.K1),'Minimum purchase L'))+
          '<p class="small" id="stmt"></p><div class="msg" id="msg"></div><div class="row"><button class="btn ghost" id="go" data-act="sub-counter">Send counter-offer</button></div></div>':'');
    }else body='<h2>Waiting for the '+party(turn)+'</h2><p class="small muted">Offer '+n+' of '+mx+' is on the table. The '+party(turn)+' can '+(n<mx?'accept, reject, or counter.':'only accept or reject it.')+'</p>'+negThread(ext,offs,null,role);
  }else if(st==='locked'){

  }else if(st==='settled'){

}

function consoleGuide(){
  const step=curStep(),st=G.stage;
  if(!step)return '<section class="panel guide"><h2>Version guide</h2><p>The game opens with one unscored practice round under the private-signal rules, then runs the four versions in order: private signal, public signal, reservation fee, minimum purchase. Each version ends with a debrief screen.</p><button class="btn sm ghost" data-act="guide">Compare all four versions</button></section>';
  if(st==='debrief'||st==='done'){
    const key=step.practice?'practice':step.ver,nvt=st==='debrief'?nextVersionTarget():null,nx=nvt==null?null:plan[nvt];
    let h='<section class="panel guide"><h2>Debrief: '+(step.practice?'practice round':esc(GUIDE[step.ver].title))+'</h2>';
    if(!step.practice){
      const ap=activePairs();let tf=0,td=0,n=0;for(const p of ap){const c=cumFor(p.id,step.ver);tf+=c.f;td+=c.d;n+=c.n;}
      const b=BENCH[step.ver];
      h+='<div class="scroll"><table class="data"><tr><th>Per round</th><th class="r">Fabless</th><th class="r">Foundry</th><th class="r">Combined</th></tr>'+
        (n?'<tr><td><b>Class average</b></td><td class="num r">'+fmt(tf/n)+'</td><td class="num r">'+fmt(td/n)+'</td><td class="num r">'+fmt((tf+td)/n)+'</td></tr>':'')+
        (b.ind?'<tr><td>Expected, independent allocation</td><td class="num r">'+fmt(b.ind[0])+'</td><td class="num r">'+fmt(b.ind[1])+'</td><td class="num r">'+fmt(b.ind[2])+'</td></tr>':'')+
        (b.eff?'<tr><td>Expected, efficient allocation (before payments)</td><td class="num r">'+fmt(b.eff[0])+'</td><td class="num r">'+fmt(b.eff[1])+'</td><td class="num r">'+fmt(b.eff[2])+'</td></tr>':'')+'</table></div>'+
        '<p class="small muted">Class averages come from a handful of random rounds, so they can differ from expected values by luck alone.</p>';
      h+='<p><b>Key idea:</b> '+GUIDE[step.ver].lesson+'</p>';
    }
    h+='<p style="margin-bottom:0"><b>Discussion questions</b></p><ul class="qs">'+DEBRIEF_Q[key].map(q=>'<li>'+q+'</li>').join('')+'</ul>';
    if(nx&&step.practice)h+='<p style="margin-top:12px"><b>Next: scoring begins with the '+esc(GUIDE[nx.ver].title.toLowerCase())+'.</b> Same rules as the practice round, and every round now counts.</p>';
    else if(nx)h+='<p style="margin-top:12px"><b>Next: '+esc(GUIDE[nx.ver].title)+'.</b> '+GUIDE[nx.ver].newv+'</p>';
    else h+='<p style="margin-top:12px"><b>That was the final version.</b> Turn on “Release cross-company profits” and “Release economic parameters” to discuss the full results.</p>';
    return h+'</section>';
  }
  const g=GUIDE[step.ver];
  return '<details class="panel guide" id="det-cguide-'+step.ver+'"'+detOpen('det-cguide-'+step.ver,true)+'><summary>Now playing: '+esc(g.title)+'</summary><p><b>'+g.short+'</b> '+g.newv+'</p>'+
    '<ol class="small">'+g.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><p class="small"><b>Who pays what:</b> '+g.pay+'</p><p class="small"><b>Key idea for the debrief:</b> '+g.lesson+'</p>'+
    '<button class="btn sm ghost" data-act="guide">Compare all four versions</button></details>';
}
function csvEscape(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  const head=['seed','position','version','round','supply_chain','fabless_team','foundry_team','signal','error','demand','request_R','allocation_K0','proposed','K1','term','accepted','offers','agreed_on_offer','agreed_by','final_K','fee_F','min_purchase_L','purchased','sold','unmet','excess','unused','fabless_profit','foundry_profit','combined','fabless_fallback','foundry_fallback','missing'];
  const rows=[head];
  for(let pos=0;pos<plan.length;pos++){if(!RV[pos])continue;for(const p of pairs){const o=resultFor(pos,p.id),s=plan[pos],r=RV[pos];
    rows.push([scen&&scen.seed||'',pos,s.ver,s.practice?'practice':s.r,p.name,p.f&&p.f.team,p.d&&p.d.team,r.S,r.eps,r.D,o.R,o.K0,o.proposed,o.K1,o.X,o.acc,o.nOff,o.accOn||'',o.accBy?(o.accBy==='f'?'fabless':'foundry'):'',o.K,o.F,o.L,o.purchased,o.sold,o.unmet,o.excess,o.unused,o.fProfit,o.dProfit,o.fProfit+o.dProfit,o.base.fProfit,o.base.dProfit,o.miss.join('|')]);}}
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}
async function download(name,data){
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});return;}}catch(e){if(e&&e.code==='declined')return;}
  modal(name,'<p class="small muted">Download the file, or select all, copy, and paste into a spreadsheet.</p><textarea style="min-height:220px" readonly onfocus="this.select()">'+esc(data)+'</textarea>',
    [{label:'Close',cls:'ghost'},{label:'Download file',cls:'',fn:()=>{blobSave(name,data);return false;}}]);
}
function blobSave(name,data){
  try{const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},800);toast('Downloading '+name);}
  catch(e){toast('Download is blocked here. Copy the text instead.');}
}

function render(){
  const app=$('#app');if(!app)return;
  const ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart,fe=ae&&ae.selectionEnd;
  if(!ready){app.innerHTML=loadingView();return;}
  if(connError){app.innerHTML=connErrorView();return;}
  if(showTitle){app.innerHTML=titleView();return;}
  if(standalone&&!NS){app.innerHTML=gateView();return;}
  let ctx=null,html='';
  if(isInst){
    if(!pairById(view.pair)&&pairs.length)view.pair=pairs[0].id;
    if(view.tab==='console')html=topbar(null)+consoleView();
    else{const p=pairById(view.pair);ctx={pair:p||{name:'–',f:{team:'–'},d:{team:'–'}},role:view.role};
      const picker='<div class="row" style="margin-bottom:12px"><label for="pp">Viewing as</label><select id="pp">'+pairs.map(x=>'<option value="'+x.id+'"'+(x.id===view.pair?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><div class="seg"><button data-act="role" data-v="f" aria-pressed="'+(view.role==='f')+'">Fabless</button><button data-act="role" data-v="d" aria-pressed="'+(view.role==='d')+'">Foundry</button></div></div>';
      html=topbar(null)+picker+(p?botBar(p,view.role)+teamView(p,view.role):waitingView('Create a supply chain first.'));}
  }else{
    const seat=seatOf(uid);
    if(!seat&&!mySeat)html=topbar(null)+joinView();
    else if(!seat)html=topbar(null)+waitingView('Loading your supply chain…');
    else if(!G)html=seat?topbar(seat)+waitingView('Your team is in: '+(seat.role==='f'?'Fabless':'Foundry')+', '+esc(seat.pair.name)+'. The game starts when your instructor opens it.'):topbar(null)+waitingView('The instructor has not created a session yet. This page will update by itself.');
    else{ctx=seat;html=topbar(ctx)+teamView(seat.pair,seat.role);}
  }
  app.innerHTML=html;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(fs!=null)el.setSelectionRange(fs,fe);}catch(e){}}}
  tickTimer();validate();
}
function botBar(pair,role){
  const s=pair[role];if(!s||s.uid!=='demo')return '';
  return '<div class="botbar"><span>'+(s.bot?'A demo team plays this seat automatically'+(G&&G.bots===false?' (paused: demo play is switched off in the console)':'')+'.':'You are playing this demo seat yourself.')+'</span><button class="btn sm ghost" data-act="botseat" data-pair="'+pair.id+'" data-role="'+role+'">'+(s.bot?'Play this seat myself':'Let the demo team play')+'</button></div>';
}
function curCtx(){
  if(isInst)return {pairId:view.pair,role:view.role};
  const s=seatOf(uid);return s?{pairId:s.pair.id,role:s.role}:null;
}
function validate(){
  const go=$('#go');if(!go||!G)return;
  const c=curCtx();if(!c)return;const mv=mvOf(G.pos,c.pairId),ext=VERS[curStep().ver].ext;let m='';
  if(G.stage==='request')m=checkReq(draft.R);
  else if(G.stage==='allocate')m=checkAlloc(draft.K0,mv.req?mv.req.R:0);
  else if(G.stage==='propose'||G.stage==='respond'){const K0=mv.alloc?mv.alloc.K0:0;m=checkProp(K0,draft.K1,draft.X,ext);const st=$('#stmt');if(st&&!m)st.innerHTML=stmtText(ext,K0,draft.K1,draft.X,G.stage==='respond'?c.role:'f');else if(st)st.innerHTML='';}
  go.disabled=!!m;const el=$('#msg');if(el){el.textContent=m;el.className='msg'+(m?' err':'');}
}
function refreshVis(){
  const c=curCtx();if(!c||!G)return;const vs=visState(c.role,c.pairId);
  const wv=$('#vis-wafer');if(wv)wv.innerHTML=waferBlock(vs);const d=$('#vis-demand'),m=$('#vis-map');if(d)d.innerHTML=demandSVG(vs.demand);if(m)m.innerHTML=mapSVG(vs.tiles);
  const w=$('#whatwrap');if(w)w.innerHTML=whatIf(c.role,c.pairId);
  validate();
}

    modal(seedVal?'Replay with seed '+seedVal+'?':'Start a new session?','<p>'+(seedVal?'This restarts the game from the practice round with the same seed, so every round gets the same signal and demand as before. ':'This draws fresh scenarios. ')+'All rounds and results are cleared from view. Seats stay as they are. Export your results first if you need them.</p>'+
      '<label for="ns-n">Scored rounds per version</label><input type="number" id="ns-n" min="1" max="8" value="'+G.n+'">'+
      '<label for="ns-t">Decision timer in seconds (0 for none)</label><input type="number" id="ns-t" min="0" max="900" value="'+G.timerSec+'">'+

  else if(a==='retry'){try{sessionStorage.removeItem('fr_local');}catch(err){}location.reload();}
  else if(a==='uselocal'){try{sessionStorage.setItem('fr_local','1');}catch(err){}location.reload();}
  else if(a==='copycode'){const v=joinUrl(NS)||NS;try{await navigator.clipboard.writeText(v);toast('Copied: '+v);}catch(err){toast(v);}}
  else if(a==='join'){const team=($('#teamname').value||'').trim();if(!team){toast('Enter a team name first.');$('#teamname').focus();return;}
    lsSet('fr_team',team);const r=b.dataset.role;const cur=pairById(b.dataset.pair);if(cur&&cur[r]){toast('That seat was just taken.');return;}
    const o={};o[r]={uid,team};await save('update','pairs/'+b.dataset.pair,o);}
  else if(a==='clear')await clearSeat(b.dataset.pair,b.dataset.role);
  else if(a==='addpair-old'){const n=pairs.length+1;await save('set','pairs/p'+n,{n,name:'Supply chain '+n,f:null,d:null});}
  else if(a==='demo'){if(!pairs.length){await save('set','pairs/p1',{n:1,name:'Supply chain 1',f:null,d:null,createdAt:Date.now()});await sleep(250);}const A=['Aurora Silicon','Meridian Fab','Nova Logic','Helix Foundry','Quartz Labs','Tidal Fab','Cobalt Design','Ember Wafer','Lumen Chips','Basalt Foundry','Vertex Labs','Opal Fab'];let i=0;
    for(const p of pairs){if(!p.f)await save('update','pairs/'+p.id,{f:{uid:'demo',team:A[(i*2)%12]+' (demo)',bot:true}});if(!p.d)await save('update','pairs/'+p.id,{d:{uid:'demo',team:A[(i*2+1)%12]+' (demo)',bot:true}});i++;}}
  else if(a==='addchain'){const n=pairs.reduce((m,x)=>Math.max(m,x.n||0),0)+1;await save('set','pairs/p'+n,{n,name:'Supply chain '+n,f:null,d:null,createdAt:Date.now()});}
  else if(a==='solo')await soloDemo();
  else if(a==='botseat'){const p=pairById(b.dataset.pair),r=b.dataset.role;if(p&&p[r]){const o={};o[r]=Object.assign({},p[r],{bot:!p[r].bot});await save('update','pairs/'+p.id,o);}}
  else if(a==='guide')openGuide();
  else if(a==='explain'){const c2=curCtx(),pos=Number(b.dataset.pos);if(c2&&RV[pos]){const s=plan[pos];modal((s.practice?'Practice round':VERS[s.ver].name+' · '+VERS[s.ver].sub+' · round '+s.r)+': what happened and why',explainHTML(c2.role,c2.pairId,pos),[{label:'Close',cls:''}],true);}}
  else if(a==='copyseed'){const v=scen&&scen.seed;try{await navigator.clipboard.writeText(v);toast('Seed '+v+' copied.');}catch(err){toast('Seed: '+v);}}
  else if(a==='replay'){if(scen&&scen.seed)openNewSession(scen.seed,scen.repeat);}
  else if(a==='sub-req')await mk('req',{R:draft.R});
  else if(a==='sub-alloc')await mk('alloc',{K0:draft.K0});
  else if(a==='sub-prop')await mk('prop',{K1:draft.K1,X:draft.X,skip:false});
  else if(a==='sub-skip')await mk('prop',{K1:null,X:0,skip:true});
  else if(a==='sub-resp'){const mv=mvOf(G.pos,c.pairId),t=negTurn(mv);if(!t||t!==c.role){toast('It is the other company’s turn.');return;}await mk('resp',{accept:b.dataset.v==='1',by:c.role,on:offersOf(mv).length});}
  else if(a==='sub-counter'){const mv=mvOf(G.pos,c.pairId),n=offersOf(mv).length,K0=mv.alloc?mv.alloc.K0:0;
    if(negTurn(mv)!==c.role){toast('It is the other company’s turn.');return;}
    if(n>=NEGMAX()){toast('No more counter-offers are allowed. Accept or reject this offer.');return;}
    if(checkProp(K0,draft.K1,draft.X,VERS[curStep().ver].ext))return;
    await mk(n===1?'o2':'o3',{K1:draft.K1,X:draft.X,by:c.role});}
  else if(a==='switchver')openSwitch(b.dataset.v);
  else if(a==='jump'){const v=$('#jump').value;const idx=plan.findIndex(x=>x.ver===v&&!x.practice);if(idx>0)modal('Jump to this version?','<p>'+esc(VERS[v].name+' · '+VERS[v].sub)+'. Rounds in between are skipped.</p>',[{label:'Cancel',cls:'ghost'},{label:'Jump',cls:'',fn:async()=>{await save('update','game/state',{pos:idx,stage:'ready',curS:null,deadline:null});}}]);}
  else if(a==='csv')download('fab-rush-results.csv',buildCsv());
  else if(a==='csvs'){const rows=['seed,position,version,round,signal,error,demand'];if(scen)plan.forEach((s,i)=>{const it=scenAt(i);if(!it)return;rows.push([csvEscape(scen.seed||''),i,s.ver,s.practice?'practice':s.r,it.S,it.eps,Math.max(0,MU+it.S+it.eps)].join(','));});download('fab-rush-scenarios.csv',rows.join('\n'));}
  else if(a==='newsess')openNewSession();
  else if(a==='title'){showTitle=true;rq();}
  else if(a==='title-enter'){showTitle=false;rq();window.scrollTo(0,0);}
  else if(a==='title-new'){showTitle=false;if(G){view.tab='console';rq();openNewSession();}else rq();window.scrollTo(0,0);}
});
init();
setTimeout(()=>{if(!ready&&!connError){connError={step:'start',code:'timeout',message:'The game did not finish starting.'};ready=true;rq();}},40000);
</script>
</body>
</html>
